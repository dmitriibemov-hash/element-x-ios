name: Build iOS App

on:
  workflow_dispatch:

jobs:
  build:
    name: Build App
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true

      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode_15.4.app

      - name: Setup Project (XcodeGen)
        run: |
          # Генерация .xcodeproj и .xcworkspace файлов с помощью встроенных инструментов
          swift run -q tools ci setup-project

      - name: Install CocoaPods
        run: |
          # Установка зависимостей через CocoaPods (если папка ElementX существует)
          if [ -d "ElementX" ]; then
            cd ElementX
            pod install
            cd ..
          fi

      - name: Build for Simulator
        run: |
          # Сборка проекта для симулятора
          xcodebuild -workspace ElementX/ElementX.xcworkspace \
                     -scheme ElementX \
                     -destination 'generic/platform=iOS Simulator' \
                     -derivedDataPath build \
                     -configuration Debug \
                     -sdk iphonesimulator \
                     build

      - name: Package App
        run: |
          # Упаковка собранного приложения в zip-архив
          cd build/Build/Products/Debug-iphonesimulator
          zip -r ElementX.app.zip ElementX.app

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ElementX-iOS-App
          path: build/Build/Products/Debug-iphonesimulator/ElementX.app.zip
          retention-days: 5
