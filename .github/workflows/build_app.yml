name: Build iOS App

on:
  workflow_dispatch:

jobs:
  build:
    name: Build App
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true

      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode_15.4.app

      - name: Setup pnpm
        uses: pnpm/action-setup@v3
        with:
          version: 9

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'pnpm'

      - name: Setup Project
        run: |
          pnpm install
          swift run -q tools ci setup-project

      - name: Install CocoaPods
        run: |
          cd ElementX
          pod install
          cd ..

      - name: Build for Simulator
        run: |
          xcodebuild -workspace ElementX/ElementX.xcworkspace \
                     -scheme ElementX \
                     -destination 'generic/platform=iOS Simulator' \
                     -derivedDataPath build \
                     -configuration Debug \
                     build

      - name: Package App
        run: |
          cd build/Build/Products/Debug-iphonesimulator
          zip -r ElementX.app.zip ElementX.app

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ElementX-iOS-App
          path: build/Build/Products/Debug-iphonesimulator/ElementX.app.zip
          retention-days: 5
