name: Build iOS App (Diagnostic)

on:
  workflow_dispatch:

jobs:
  diagnose:
    name: Diagnose Structure
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true

      - name: List Files
        run: |
          echo "--- Root Directory ---"
          ls -F
          echo "--- Searching for package.json ---"
          find . -name "package.json" -maxdepth 3
          echo "--- Searching for pnpm-lock.yaml ---"
          find . -name "pnpm-lock.yaml" -maxdepth 3
