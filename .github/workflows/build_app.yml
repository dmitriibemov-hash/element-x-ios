name: Build iOS App

on:
  workflow_dispatch:

jobs:
  build:
    name: Build App
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true

      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode_15.4.app

      - name: Setup Environment
        run: |
          # Установка pnpm через официальный метод
          curl -fsSL https://get.pnpm.io/install.sh | sh -
          export PNPM_HOME="$HOME/.local/share/pnpm"
          export PATH="$PNPM_HOME:$PATH"
          
          # Установка зависимостей проекта
          pnpm install
          
          # Генерация файлов проекта (XcodeGen )
          swift run -q tools ci setup-project

      - name: Install CocoaPods
        run: |
          cd ElementX
          pod install
          cd ..

      - name: Build for Simulator
        run: |
          xcodebuild -workspace ElementX/ElementX.xcworkspace \
                     -scheme ElementX \
                     -destination 'generic/platform=iOS Simulator' \
                     -derivedDataPath build \
                     -configuration Debug \
                     build

      - name: Package App
        run: |
          cd build/Build/Products/Debug-iphonesimulator
          zip -r ElementX.app.zip ElementX.app

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ElementX-iOS-App
          path: build/Build/Products/Debug-iphonesimulator/ElementX.app.zip
          retention-days: 5
